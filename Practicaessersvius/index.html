<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pràctica Interactiva: Els Éssers Vius (5è de Primària)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Header -->
  <header class="bg-indigo-600 text-white py-6 px-4 shadow-md text-center">
    <div class="max-w-3xl mx-auto">
      <span class="bg-indigo-500 text-indigo-100 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Coneixement del Medi • 5è de Primària</span>
      <h1 class="text-2xl sm:text-3xl font-bold mt-2">Unitat 1: Una gran varietat d'éssers vius</h1>
      <p class="text-indigo-200 text-sm mt-1">Practica quantes vegades vulguis! Les preguntes canviaran a cada intent.</p>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-200">
      <!-- Dynamic Content rendered by JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-slate-500">
    Fitxer d'activitats d'autorepàs per a l'alumnat • Descarregable i d'ús sense connexió
  </footer>

  <script>
    // Banc complet de preguntes de la Unitat 1 (Medi 5è)
    const questionBank = [
      {
        question: "Quina d'aquestes opcions descriu correctament un organisme amb nutrició autòtrofa?",
        options: [
          "Una alga que fabrica el seu propi aliment mitjançant la llum del sol",
          "Un lleó que caça altres animals per alimentar-se",
          "Un bolet que absorbeix nutrients de matèria en descomposició",
          "Un bacteris que necessita menjar restes orgàniques del medi"
        ],
        correctIndex: 0,
        explanation: "Els organismes autòtrofs (com les plantes i les algues) elaboren el seu propi aliment a partir de substàncies inorgàniques i llum solar."
      },
      {
        question: "La maduixera produeix tiges horitzontals (estolons) que arrelen i formen noves plantes filles. Quin tipus de procés s'està produint?",
        options: [
          "Reproducció asexual",
          "Reproducció sexual",
          "Funció de relació",
          "Nutrició heteròtrofa"
        ],
        correctIndex: 0,
        explanation: "La reproducció asexual requereix un sol progenitor i produeix descendents genèticament idèntics (com els estolons o esqueixos)."
      },
      {
        question: "Quin d'aquests components cel·lulars té la funció principal de dirigir i controlar tot el funcionament de la cèl·lula?",
        options: [
          "El nucli",
          "El citoplasma",
          "La membrana plasmàtica",
          "La paret cel·lular"
        ],
        correctIndex: 0,
        explanation: "El nucli conté el material genètic (DNA) i actua com el centre de control de la cèl·lula."
      },
      {
        question: "Observes al microscopi una cèl·lula de forma prismàtica regular, amb paret rígida i cloroplasts verdosos. De quin tipus de cèl·lula es tracta?",
        options: [
          "Una cèl·lula vegetal",
          "Una cèl·lula animal",
          "Un protozou",
          "Un bacteri"
        ],
        correctIndex: 0,
        explanation: "Les cèl·lules vegetals tenen forma prismàtica, paret cel·lular rígida de cel·lulosa i cloroplasts per fer la fotosíntesi."
      },
      {
        question: "Quina és la funció dels cloroplasts a les cèl·lules vegetals?",
        options: [
          "Realitzar la fotosíntesi per fabricar aliment",
          "Eliminar les substàncies de rebuig de la cèl·lula",
          "Protegir la cèl·lula de l'exterior",
          "Emagatzemar aigua i minerals únicament"
        ],
        correctIndex: 0,
        explanation: "Els cloroplasts contenen clorofil·la i s'encarreguen de captar la llum per fer la fotosíntesi."
      },
      {
        question: "Quin és l'ordre correcte dels nivells d'organització dels éssers vius, del més senzill al més complex?",
        options: [
          "Cèl·lula → Teixit → Òrgan → Sistema / Aparell → Organisme",
          "Organisme → Aparell → Òrgan → Teixit → Cèl·lula",
          "Teixit → Cèl·lula → Òrgan → Organisme → Aparell",
          "Cèl·lula → Òrgan → Teixit → Aparell → Organisme"
        ],
        correctIndex: 0,
        explanation: "Les cèl·lules formen teixits, els teixits formen òrgans, els òrgans formen sistemes/aparells i aquests formen l'organisme complet."
      },
      {
        question: "Un conjunt de cèl·lules similars especialitzades a realitzar una mateixa funció concreta s'anomena:",
        options: [
          "Teixit",
          "Òrgan",
          "Aparell",
          "Organisme"
        ],
        correctIndex: 0,
        explanation: "Un teixit (com el teixit muscular o el teixit epitelial) és una agrupació de cèl·lules especialitzades."
      },
      {
        question: "En quina categoria de nivell d'organització trobem la llengua d'un animal o la fulla d'una planta?",
        options: [
          "Òrgan",
          "Teixit",
          "Aparell",
          "Cèl·lula"
        ],
        correctIndex: 0,
        explanation: "Tant la fulla com la llengua estan formades per diferents teixits coordinats, per tant són òrgans."
      },
      {
        question: "Quina d'aquestes característiques és comuna a TOTS els organismes del regne dels fongs?",
        options: [
          "Són heteròtrofs i no poden desplaçar-se",
          "Fabriquen el seu propi aliment amb la llum solar",
          "Són tots unicel·lulars microscopicament petits",
          "Poden desplaçar-se lliurement per buscar menjar"
        ],
        correctIndex: 0,
        explanation: "Els fongs (com els bolets o els llevats) són heteròtrofs (s'alimenten d'altres éssers) i viuen fixos al medi."
      },
      {
        question: "A quin regne pertanyen els protozous (unicel·lulars heteròtrofs) i les algues?",
        options: [
          "Regne dels Protoctistes",
          "Regne dels Fongs",
          "Regne de les Moneres",
          "Regne dels Animals"
        ],
        correctIndex: 0,
        explanation: "El regne dels protoctistes inclou tant els protozous com les algues unicel·lulars i pluricel·lulars."
      },
      {
        question: "Quina característica descriu correctament tots els membres del regne de les Moneres (bacteris)?",
        options: [
          "Són organismes unicel·lulars molt senzills sense nucli definit",
          "Són tots pluricel·lulars visible a ull nud",
          "Tots fan la fotosíntesi exactament com les plantes",
          "Tenen cèl·lules complexes amb nucli i cloroplasts"
        ],
        correctIndex: 0,
        explanation: "Les moneres o bacteris són els organismes més senzills de la Terra, unicel·lulars i de tipus procariota (sense nucli)."
      },
      {
        question: "Quan una planta gira les seves fulles cap a la llum del sol, quina funció vital està realitzant?",
        options: [
          "Funció de relació",
          "Funció de reproducció",
          "Funció de descomposició",
          "Funció de digestió"
        ],
        correctIndex: 0,
        explanation: "La funció de relació permet als éssers vius captar estímuls de l'entorn (com la llum) i respondre-hi."
      },
      {
        question: "Quin d'aquests regnes té TOTS els seus individus autòtrofs i pluricel·lulars?",
        options: [
          "Regne de les Plantes",
          "Regne dels Fongs",
          "Regne dels Animals",
          "Regne dels Protoctistes"
        ],
        correctIndex: 0,
        explanation: "Totes les plantes són pluricel·lulars i fabriquen el seu propi aliment (són autòtrofes)."
      },
      {
        question: "Quina és la capa prima que envolta la cèl·lula, la protegeix i controla quines substàncies hi entren o en surten?",
        options: [
          "Membrana plasmàtica",
          "Paret cel·lular",
          "Citoplasma",
          "Cloroplast"
        ],
        correctIndex: 0,
        explanation: "La membrana plasmàtica és el límit exterior flexible de totes les cèl·lules que regula l'intercanvi amb l'exterior."
      },
      {
        question: "Quina d'aquestes opcions és un exemple d'aparell o sistema en el cos humà?",
        options: [
          "L'aparell digestiu",
          "El teixit muscular",
          "El cor",
          "Un glòbul vermell"
        ],
        correctIndex: 0,
        explanation: "L'aparell digestiu està conformat per diversos òrgans (estómac, intestins, fetge...) treballant conjuntament."
      }
    ];

    // Estat de l'aplicació
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let selectedOption = null;
    let answered = false;

    const appContainer = document.getElementById('app');

    // Funció per barrejar un array (Fisher-Yates Shuffle)
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Inicialitzar una nova pràctica (escull 10 preguntes a l'atzar i en barreja les opcions)
    function startNewQuiz() {
      const shuffledBank = shuffle(questionBank);
      const selected = shuffledBank.slice(0, 10);

      currentQuestions = selected.map(q => {
        const rawOptions = q.options.map((opt, idx) => ({
          text: opt,
          isCorrect: idx === q.correctIndex
        }));
        const shuffledOptions = shuffle(rawOptions);
        return {
          question: q.question,
          options: shuffledOptions,
          explanation: q.explanation
        };
      });

      currentIndex = 0;
      score = 0;
      selectedOption = null;
      answered = false;

      renderQuestion();
    }

    // Renderitzar la pregunta actual
    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      const progressPercent = ((currentIndex + 1) / currentQuestions.length) * 100;

      appContainer.innerHTML = `
        <!-- Progress Bar -->
        <div class="mb-6">
          <div class="flex justify-between items-center text-xs text-slate-500 font-semibold mb-1">
            <span>PREGUNTA ${currentIndex + 1} DE ${currentQuestions.length}</span>
            <span>PUNTUACIÓ: ${score}</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-2.5">
            <div class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
          </div>
        </div>

        <!-- Question Text -->
        <h2 class="text-lg sm:text-xl font-bold text-slate-800 mb-6">${q.question}</h2>

        <!-- Options -->
        <div class="space-y-3 mb-6">
          ${q.options.map((opt, idx) => {
            let btnClass = "w-full text-left p-4 rounded-xl border border-slate-200 transition-all font-medium flex justify-between items-center ";
            
            if (!answered) {
              btnClass += "hover:bg-indigo-50 hover:border-indigo-300 bg-slate-50 text-slate-700 cursor-pointer";
            } else {
              if (opt.isCorrect) {
                btnClass += "bg-emerald-100 border-emerald-400 text-emerald-900 font-semibold";
              } else if (selectedOption === idx) {
                btnClass += "bg-rose-100 border-rose-400 text-rose-900";
              } else {
                btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
              }
            }

            return `
              <button onclick="handleOptionSelect(${idx})" ${answered ? 'disabled' : ''} class="${btnClass}">
                <span>${opt.text}</span>
                ${answered && opt.isCorrect ? '<span class="text-emerald-600 font-bold ml-2">✓</span>' : ''}
                ${answered && selectedOption === idx && !opt.isCorrect ? '<span class="text-rose-600 font-bold ml-2">✗</span>' : ''}
              </button>
            `;
          }).join('')}
        </div>

        <!-- Feedback & Explanation (si s'ha respost) -->
        ${answered ? `
          <div class="p-4 rounded-xl mb-6 text-sm ${q.options[selectedOption].isCorrect ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}">
            <p class="font-bold mb-1">${q.options[selectedOption].isCorrect ? ' Resposta correcta!' : ' Resposta incorrecta'}</p>
            <p>${q.explanation}</p>
          </div>
        ` : ''}

        <!-- Next / Finish Button -->
        <div class="flex justify-end">
          ${answered ? `
            <button onclick="nextQuestion()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition-all flex items-center gap-2">
              ${currentIndex < currentQuestions.length - 1 ? 'Següent pregunta →' : 'Veure resultats'}
            </button>
          ` : `
            <p class="text-xs text-slate-400 italic">Tria una opció per comprovar la resposta</p>
          `}
        </div>
      `;
    }

    // Selecció d'opció
    function handleOptionSelect(index) {
      if (answered) return;
      selectedOption = index;
      answered = true;

      if (currentQuestions[currentIndex].options[index].isCorrect) {
        score++;
      }

      renderQuestion();
    }

    // Avançar pregunta o anar a la pantalla final
    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        selectedOption = null;
        answered = false;
        renderQuestion();
      } else {
        renderResults();
      }
    }

    // Pàgina final de resultats
    function renderResults() {
      const percentage = Math.round((score / currentQuestions.length) * 100);
      let title = "";
      let badgeColor = "";

      if (percentage >= 90) {
        title = " Excel·lent treball! Ets un expert/a en els éssers vius!";
        badgeColor = "bg-emerald-100 text-emerald-800 border-emerald-300";
      } else if (percentage >= 70) {
        title = " Molt bé! Tens molt clars els conceptes de la unitat.";
        badgeColor = "bg-blue-100 text-blue-800 border-blue-300";
      } else if (percentage >= 50) {
        title = " Bon intent! Has superat la prova, però pots millorar.";
        badgeColor = "bg-amber-100 text-amber-800 border-amber-300";
      } else {
        title = " Cal repassar un poc més la Unitat 1.";
        badgeColor = "bg-rose-100 text-rose-800 border-rose-300";
      }

      appContainer.innerHTML = `
        <div class="text-center py-4">
          <div class="inline-block p-4 rounded-full bg-indigo-100 text-indigo-600 mb-4 text-4xl">
            🏆
          </div>
          <h2 class="text-2xl font-bold text-slate-800 mb-2">Resultats de la pràctica</h2>
          <div class="inline-block px-4 py-2 rounded-full border ${badgeColor} font-bold text-sm mb-6">
            ${title}
          </div>

          <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200 mb-8 max-w-sm mx-auto">
            <div class="text-5xl font-extrabold text-indigo-600 mb-2">${score} / ${currentQuestions.length}</div>
            <div class="text-slate-500 font-medium">${percentage}% encerts</div>
          </div>

          <p class="text-slate-600 text-sm mb-6">
            Vols tornar a practicar? Si prem el botó, es seleccionarà un <strong>nou conjunt de preguntes barrejades</strong>!
          </p>

          <button onclick="startNewQuiz()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5">
            🔄 Practicar de nou (Noves preguntes)
          </button>
        </div>
      `;
    }

    // Iniciar al carregar la pàgina
    window.onload = startNewQuiz;
  </script>
</body>
</html>
